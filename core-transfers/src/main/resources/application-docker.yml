server:
  port: 9590
spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://core-transfers-postgres:5432/mt_core_transfers?minimumIdle=2
    username: mt_core_transfers_admin
    password: mt_core_transfers_admin
    hikari:
      minimumIdle: 2
      maximumPoolSize: 4
  jpa:
    show-sql: true
    open-in-view: false
  kafka:
    producer:
      properties:
        schema.registry.url: http://schema-registry:8081
        allow.auto.create.topics: true
      bootstrap-servers: broker-1:29091, broker-2:29092, broker-3:29093
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: io.confluent.kafka.serializers.KafkaAvroSerializer
management:
  endpoint:
    health:
      show-details: always
  endpoints:
    web:
      exposure:
        include: '*'
integrations:
  services:
    limits:
      url: http://limits:9591/api/v1/limits/
      read-timeout: 30s
      connect-timeout: 40s
logstash:
  destination:
    host: logstash:5000