services:
  limits:
    build:
      context: ../../../
      dockerfile: limits/Dockerfile
    image: mt-limits:latest
    container_name: mt-limits
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "9591:9591"
    networks:
      - db-net
      - elk-net
      - monitoring-net
      - kafka-net
    depends_on:
      - mt-core-transfers
      - logstash
      - broker-1
      - broker-2
      - broker-3
      - schema-registry