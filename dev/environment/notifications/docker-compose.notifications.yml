services:
  notifications:
    build:
      context: ../../../
      dockerfile: notifications/Dockerfile
      args:
        - NO_CACHE=true
    image: mt-notifications:latest
    container_name: mt-notifications
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    ports:
      - "9592:9592"
    networks:
      - db-net
      - elk-net
      - monitoring-net
      - kafka-net
    depends_on:
      core-transfers-postgres:
        condition: service_healthy